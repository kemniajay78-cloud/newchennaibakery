<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Chennai Bakery Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet"><style>
:root{--ink:#2b2521;--muted:#776d66;--paper:#fffdf9;--cream:#fff8ef;--coral:#e85d4a;--yellow:#ffc857;--mint:#d8f0df;--line:#eadfd4}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font:14px 'DM Sans',sans-serif}button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(430px,100%);background:var(--paper);padding:40px;border-radius:20px;box-shadow:0 20px 60px #553e2b1a}.brand{font:700 25px 'Playfair Display',serif;margin-bottom:5px}.eyebrow{color:var(--coral);font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:700}.login h1{font:700 36px 'Playfair Display',serif;margin:12px 0 7px}.muted{color:var(--muted);line-height:1.6}.field{margin:17px 0}.field label{display:block;font-size:12px;font-weight:700;margin:0 0 6px}.field input,.field select,.field textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#fff;outline:0}.primary{background:var(--coral);color:#fff;padding:13px 18px;border-radius:10px;font-weight:700}.back{display:block;margin-top:18px;color:var(--coral-dark);text-decoration:none;font-size:13px}.error{color:#b33b2d;background:#ffe2dc;border-radius:8px;padding:10px;margin:12px 0;font-size:13px}.app{display:flex;min-height:100vh}.side{width:245px;background:var(--ink);color:#fff;padding:28px 17px;flex:0 0 auto}.side .brand{color:#fff}.side small{display:block;color:#d2c4ba;margin:5px 0 31px}.nav{display:grid;gap:5px}.nav button{background:transparent;color:#d7cdc5;padding:11px 12px;text-align:left;border-radius:8px}.nav button.active,.nav button:hover{background:#493c34;color:#fff}.main{width:100%;padding:30px 4vw;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.top h1{font:700 34px 'Playfair Display',serif;margin:5px 0}.actions{display:flex;gap:10px}.ghost{background:#fff;border:1px solid var(--line);padding:11px 14px;border-radius:9px;color:var(--ink);font-weight:700}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-bottom:30px}.stat{background:var(--paper);border:1px solid var(--line);border-radius:13px;padding:18px}.stat small{display:block;color:var(--muted);font-size:11px}.stat strong{display:block;font-size:28px;margin-top:10px}.workspace{background:var(--paper);border:1px solid var(--line);border-radius:15px;padding:22px}.workspace h2{font:700 25px 'Playfair Display',serif;margin:0 0 18px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:720px}th,td{text-align:left;padding:12px 9px;border-bottom:1px solid var(--line);font-size:12px}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em}.thumb{width:42px;height:38px;object-fit:cover;border-radius:7px;background:#eee}.pill{padding:5px 7px;border-radius:5px;background:var(--mint);color:#39734f;font-size:10px;font-weight:700}.pill.off{background:#ffe2dc;color:#a63d31}.row-actions{display:flex;gap:5px}.row-actions button{padding:7px;border-radius:6px;background:#f1e8df;font-size:11px}.hidden{display:none}.product-form{display:grid;grid-template-columns:1fr 1fr;gap:4px 16px}.product-form .full{grid-column:1/-1}.form-actions{display:flex;gap:9px;margin-top:17px}.preview{max-width:130px;max-height:90px;object-fit:cover;border-radius:8px;display:none;margin-top:8px}.mobile-menu{display:none}@media(max-width:900px){.cards{grid-template-columns:repeat(3,1fr)}.side{width:205px}}@media(max-width:650px){.app{display:block}.side{width:100%;padding:15px 18px}.side small{margin:4px 0 12px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.main{padding:20px 4vw}.cards{grid-template-columns:repeat(2,1fr)}.top{align-items:flex-start;flex-direction:column}.product-form{grid-template-columns:1fr}.product-form .full{grid-column:auto}}
</style></head><body><div id="root"></div><script>
const root=document.getElementById('root');const api=async(url,opt={})=>{const res=await fetch(url,{credentials:'same-origin',...opt,headers:{'Content-Type':'application/json',...(opt.headers||{})}});const data=await res.json().catch(()=>({}));if(!res.ok)throw Error(data.error||'Request failed');return data};
function login(){root.innerHTML=`<main class="login"><form class="login-card" id="loginForm"><div class="brand">CHENNAI BAKERY</div><div class="eyebrow">Admin Portal</div><h1>Welcome back.</h1><p class="muted">Sign in to manage the bakery catalogue and operations.</p><div id="loginError"></div><div class="field"><label>Email or admin ID</label><input id="email" type="text" autocomplete="username" required></div><div class="field"><label>Password</label><input id="password" type="password" autocomplete="current-password" required></div><button class="primary" style="width:100%">Login</button><a class="back" href="/">← Back to Chennai Bakery</a></form></main>`;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();try{await api('/api/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});location.href='/admin'}catch(err){document.getElementById('loginError').innerHTML=`<div class="error">${err.message}</div>`}}}
let products=[];function shell(){root.innerHTML=`<div class="app"><aside class="side"><div class="brand">Chennai Bakery</div><small>Admin Dashboard</small><nav class="nav"><button class="active" data-view="dashboard">▦ Dashboard</button><button data-view="products">▣ Products</button><button data-view="inventory">◫ Inventory</button><button data-view="categories">⌗ Categories</button><button data-view="orders">▤ Orders</button><button data-view="customers">♙ Customers</button><button data-view="offers">％ Offers</button><button data-view="delivery">⌖ Delivery</button><button data-view="custom-cakes">✧ Custom Cakes</button><button data-view="content">▤ Website Content</button><button data-view="chatbot">✦ Chatbot</button><button data-view="settings">⚙ Settings</button></nav></aside><main class="main"><header class="top"><div><div class="eyebrow">Chennai Bakery</div><h1 id="pageTitle">Admin Dashboard</h1></div><div class="actions"><a href="/" class="ghost">View Website</a><button class="ghost" id="logout">Logout</button></div></header><section id="view"></section></main></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');showView(b.dataset.view)});document.getElementById('logout').onclick=async()=>{await api('/api/auth/logout',{method:'POST'});location.href='/admin/login'};showView('dashboard')}
async function showView(view){const titles={dashboard:'Admin Dashboard',products:'Product Management',inventory:'Inventory',categories:'Categories',orders:'Orders',customers:'Customers',offers:'Offers',delivery:'Delivery', 'custom-cakes':'Custom Cake Requests',content:'Website Content',chatbot:'Chatbot Management',settings:'Settings'};document.getElementById('pageTitle').textContent=titles[view]||'Admin Dashboard';if(view==='products'||view==='inventory')return productsView(view);if(view==='orders')return ordersView();if(view==='dashboard')return dashboardView();if(view==='content')return storyView();document.getElementById('view').innerHTML=`<section class="workspace"><h2>${titles[view]}</h2><p class="muted">This protected module is ready for connection to its operational data. No customer or business data is exposed here until that data source is configured.</p></section>`}
async function ordersView(){const orders=await api('/api/admin/orders');document.getElementById('view').innerHTML=`<section class="workspace"><h2>Orders</h2>${orders.length?`<div class="table-wrap"><table><tr><th>Order</th><th>Customer</th><th>Area</th><th>Total</th><th>Status</th><th>Payment reference</th><th>Created</th></tr>${orders.map(o=>`<tr><td><b>${o.order_number}</b></td><td>${o.customer_name}<br><small>${o.phone}</small></td><td>${o.area}</td><td>₹${o.total}</td><td><span class="pill ${o.status==='PAID'?'':'off'}">${o.status}</span></td><td>${o.payment_reference||'—'}</td><td>${o.created_at}</td></tr>`).join('')}</table></div>`:'<p class="muted">No orders yet.</p>'}</section>`}
async function dashboardView(){const data=await api('/api/admin/dashboard');const s=data.stats;document.getElementById('view').innerHTML=`<div class="cards"><div class="stat"><small>Total Products</small><strong>${s.totalProducts}</strong></div><div class="stat"><small>Active Products</small><strong>${s.activeProducts}</strong></div><div class="stat"><small>Out of Stock</small><strong>${s.outOfStock}</strong></div><div class="stat"><small>Low Stock</small><strong>${s.lowStock}</strong></div><div class="stat"><small>Open Cake Requests</small><strong>${s.customCakeRequests}</strong></div></div><section class="workspace"><h2>Recent activity</h2>${data.audit.length?`<div class="table-wrap"><table><tr><th>Admin</th><th>Action</th><th>Item</th><th>Date</th></tr>${data.audit.map(x=>`<tr><td>${x.email}</td><td>${x.action}</td><td>${x.affected_item}</td><td>${x.created_at}</td></tr>`).join('')}</table></div>`:'<p class="muted">No admin activity recorded yet.</p>'}</section>`}
async function productsView(view){products=await api('/api/admin/products');if(view==='inventory'){document.getElementById('view').innerHTML=`<section class="workspace"><h2>Inventory levels</h2><div class="table-wrap"><table><tr><th>Product</th><th>Stock</th><th>Threshold</th><th>Status</th><th>Action</th></tr>${products.map(p=>`<tr><td>${p.name}</td><td>${p.stock}</td><td>${p.low_stock_threshold}</td><td><span class="pill ${p.stock===0?'off':''}">${p.stock===0?'OUT OF STOCK':p.stock<=p.low_stock_threshold?'LOW STOCK':'IN STOCK'}</span></td><td><button class="ghost" onclick="editProduct(${p.id})">Update</button></td></tr>`).join('')}</table></div></section>`;return}document.getElementById('view').innerHTML=`<section class="workspace"><div class="top" style="margin-bottom:15px"><h2>Products</h2><button class="primary" onclick="newProduct()">＋ Add Product</button></div><div class="table-wrap"><table><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Status</th><th>Actions</th></tr>${products.map(p=>`<tr><td><img class="thumb" src="${p.image}" alt=""></td><td><b>${p.name}</b></td><td>${p.category}</td><td>₹${p.price}</td><td>${p.stock}</td><td><span class="pill ${p.active?'':'off'}">${p.active?'ACTIVE':'INACTIVE'}</span></td><td class="row-actions"><button onclick="editProduct(${p.id})">Edit</button><button onclick="archiveProduct(${p.id})">Archive</button></td></tr>`).join('')}</table></div></section>`}
async function storyView(){const story=await api('/api/admin/content/story');document.getElementById('view').innerHTML=`<section class="workspace"><h2>Our Story</h2><p class="muted">Manage the founder story shown on the customer homepage. Use a real founder photograph when available; the current image is a bakery-themed placeholder.</p><form id="storyForm" class="product-form"><div class="field"><label>Founder names</label><input id="storyNames" value="${story.founderNames||''}" required></div><div class="field"><label>Story heading</label><input id="storyHeadingAdmin" value="${story.storyHeading||''}" required></div><div class="field full"><label>Story subheading</label><input id="storySubheadingAdmin" value="${story.storySubheading||''}" required></div><div class="field full"><label>Story text</label><textarea id="storyTextAdmin" rows="12" required>${story.storyText||''}</textarea></div><div class="field full"><label>Closing quote</label><input id="storyQuoteAdmin" value="${story.closingQuote||''}" required></div><div class="field full"><label>Founder image (JPG, JPEG, PNG or WEBP, max 5MB)</label><input id="storyImageFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="storyPreview" class="preview" src="${story.founderImage||''}" style="${story.founderImage?'display:block':''}" alt="Founder image preview"><div class="form-actions"><button type="button" class="ghost" id="removeStoryImage">Remove image</button></div></div><div class="field"><label><input id="storyVisible" type="checkbox" ${story.showStory!=='0'?'checked':''}> Show Our Story section</label></div><div class="full form-actions"><button class="primary">Save story content</button></div></form></section>`;document.getElementById('storyImageFile').onchange=e=>{const file=e.target.files[0];if(file){document.getElementById('storyPreview').src=URL.createObjectURL(file);document.getElementById('storyPreview').style.display='block'}};document.getElementById('removeStoryImage').onclick=async()=>{await api('/api/admin/content/story/image',{method:'DELETE'});storyView()};document.getElementById('storyForm').onsubmit=async e=>{e.preventDefault();let image=story.founderImage||'';const file=document.getElementById('storyImageFile').files[0];if(file){const form=new FormData();form.append('image',file);const uploaded=await fetch('/api/admin/uploads',{method:'POST',body:form,credentials:'same-origin'});const result=await uploaded.json();if(!uploaded.ok)throw Error(result.error);image=result.url}await api('/api/admin/content/story',{method:'PUT',body:JSON.stringify({founderNames:storyNames.value,storyHeading:storyHeadingAdmin.value,storySubheading:storySubheadingAdmin.value,storyText:storyTextAdmin.value,closingQuote:storyQuoteAdmin.value,founderImage:image,showStory:storyVisible.checked?'1':'0'})});storyView()}}
function productForm(p={}){document.getElementById('view').innerHTML=`<section class="workspace"><h2>${p.id?'Edit product':'Add product'}</h2><form id="productForm" class="product-form"><div class="field"><label>Product name *</label><input id="pName" value="${p.name||''}" required></div><div class="field"><label>Category *</label><select id="pCategory"><option>Cakes</option><option>Cookies</option><option>Breads</option><option>Pastries</option><option>Snacks</option></select></div><div class="field"><label>Price (₹) *</label><input id="pPrice" type="number" min="0" value="${p.price||''}" required></div><div class="field"><label>Stock quantity</label><input id="pStock" type="number" min="0" value="${p.stock||0}"></div><div class="field"><label>Low stock threshold</label><input id="pThreshold" type="number" min="0" value="${p.low_stock_threshold||5}"></div><div class="field"><label>Dietary</label><select id="pEggless"><option value="0">Regular</option><option value="1">Eggless</option></select></div><div class="field full"><label>Description *</label><textarea id="pDescription" required>${p.description||''}</textarea></div><div class="field"><label>Ingredients</label><input id="pIngredients" value="${p.ingredients||''}"></div><div class="field"><label>Allergen information</label><input id="pAllergens" value="${p.allergens||''}"></div><div class="field full"><label>Product image (JPG, PNG, WEBP, max 5MB)</label><input id="pImageFile" type="file" accept="image/jpeg,image/png,image/webp"><img id="preview" class="preview" src="${p.image||''}" style="${p.image?'display:block':''}" alt="Preview"></div><div class="field"><label><input id="pActive" type="checkbox" ${p.active!==0?'checked':''}> Active</label></div><div class="field"><label><input id="pFeatured" type="checkbox" ${p.featured?'checked':''}> Featured</label></div><div class="full form-actions"><button class="primary">Save product</button><button type="button" class="ghost" onclick="productsView('products')">Cancel</button></div></form></section>`;document.getElementById('pCategory').value=p.category||'Cakes';document.getElementById('pEggless').value=p.eggless?'1':'0';document.getElementById('pImageFile').onchange=e=>{const file=e.target.files[0];if(file)document.getElementById('preview').src=URL.createObjectURL(file),document.getElementById('preview').style.display='block'};document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();let image=p.image||'';const file=document.getElementById('pImageFile').files[0];if(file){const form=new FormData();form.append('image',file);const uploaded=await fetch('/api/admin/uploads',{method:'POST',body:form,credentials:'same-origin'});const result=await uploaded.json();if(!uploaded.ok)throw Error(result.error);image=result.url}const body={name:pName.value,category:pCategory.value,price:Number(pPrice.value),stock:Number(pStock.value),low_stock_threshold:Number(pThreshold.value),description:pDescription.value,ingredients:pIngredients.value,allergens:pAllergens.value,image,eggless:pEggless.value==='1',active:pActive.checked,featured:pFeatured.checked};await api(p.id?`/api/admin/products/${p.id}`:'/api/admin/products',{method:p.id?'PUT':'POST',body:JSON.stringify(body)});productsView('products')}}
function newProduct(){productForm()}function editProduct(id){productForm(products.find(p=>p.id===id))}async function archiveProduct(id){if(!confirm('Are you sure you want to archive this product? Historical order data remains intact.'))return;await api('/api/admin/products/'+id,{method:'DELETE'});productsView('products')}
api('/api/auth/me').then(shell).catch(()=>{if(location.pathname!=='/admin/login')location.href='/admin/login';else login()});
</script></body></html>
